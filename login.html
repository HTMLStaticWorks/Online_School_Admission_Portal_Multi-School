<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | EduPath</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <meta name="description" content="Log in to EduPath to manage your school applications, documents and admission status.">

    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/rtl.css">

    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="auth-page">

    <!-- Utilities: kept in flow above the card so they never overlap it -->
    <div class="auth-topbar">
        <div class="auth-utils" style="margin-left: auto;">
            <button class="theme-toggle" aria-label="Toggle Theme">
                <i class="ph ph-moon"></i>
            </button>
            <button class="rtl-toggle" aria-label="Toggle Text Direction">
                <i class="ph ph-arrows-left-right"></i>
            </button>
        </div>
    </div>

    <div class="auth-shell">
        <main class="auth-card">
            <div class="auth-brand">
                <a href="index.html" class="navbar-brand" aria-label="EduPath home">
                    <svg class="brand-logo" viewBox="0 0 222 64" preserveAspectRatio="xMinYMid meet" role="img" aria-label="EduPath"><title>EduPath</title><g transform="translate(4,6) scale(0.2)" fill="currentColor"><g class="brand-mark"><path d="M176,207.24a119,119,0,0,0,16-7.73V240a8,8,0,0,1-16,0Zm11.76-88.43-56-29.87a8,8,0,0,0-7.52,14.12L171,128l17-9.06Zm64-29.87-120-64a8,8,0,0,0-7.52,0l-120,64a8,8,0,0,0,0,14.12L32,117.87v48.42a15.91,15.91,0,0,0,4.06,10.65C49.16,191.53,78.51,216,128,216a130,130,0,0,0,48-8.76V130.67L171,128l-43,22.93L43.83,106l0,0L25,96,128,41.07,231,96l-18.78,10-.06,0L188,118.94a8,8,0,0,1,4,6.93v73.64a115.63,115.63,0,0,0,27.94-22.57A15.91,15.91,0,0,0,224,166.29V117.87l27.76-14.81a8,8,0,0,0,0-14.12Z"/></g></g><text class="brand-text" x="66" y="42"><tspan fill="currentColor">Edu</tspan><tspan fill="#E89C83">Path</tspan></text></svg>

                </a>
            </div>

            <div class="auth-header">
                <h1>Welcome Back</h1>
                <p>Log in to manage your applications and admissions</p>
            </div>

            <form action="parent-dashboard.html">
                <div class="form-group">
                    <label class="form-label" for="loginEmail">Email Address</label>
                    <input type="email" class="form-control" id="loginEmail" name="email" autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="loginPassword">Password</label>
                    <div class="password-field">
                        <input type="password" class="form-control" id="loginPassword" name="password" autocomplete="current-password" required>
                        <button type="button" class="password-toggle" data-target="loginPassword" aria-label="Show password" aria-pressed="false">
                            <i class="ph ph-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="auth-row">
                    <label class="auth-check" for="remember">
                        <input type="checkbox" id="remember" name="remember">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="auth-link">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-auth">Login to Account</button>
            </form>

            <div class="auth-divider">or</div>

            <button type="button" class="btn btn-social">
                <svg viewBox="0 0 24 24" width="18" height="18" xmlns="http://www.w3.org/2000/svg" style="flex-shrink: 0;">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22c-.87-2.6-2.87-4.53-6.16-4.53z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
                </svg> Continue with Google
            </button>
            <button type="button" class="btn btn-social">
                <i class="ph-fill ph-apple-logo"></i> Continue with Apple
            </button>

            <p class="auth-footer">
                Don't have an account? <a href="register.html" class="auth-link">Register here</a>
            </p>
        </main>
    </div>

    <script src="assets/js/main.js"></script>
</body>
</html>
